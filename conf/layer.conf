# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-srp-platform"
BBFILE_PATTERN_meta-srp-platform = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-srp-platform = "6"

LAYERDEPENDS_meta-srp-platform = "core"
LAYERSERIES_COMPAT_meta-srp-platform2 = "styhead"
